<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Morning Routine</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      background: #111;
      color: white;
    }

    /* ============================================================
       BACKGROUND
       ============================================================ */

    #background {
      position: fixed;
      inset: 0;

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      z-index: 0;
    }

    #overlay {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.25);

      z-index: 1;
    }

    /* ============================================================
       MAIN SCENE
       ============================================================ */

    #scene {
      position: relative;

      z-index: 2;

      width: 100%;
      height: 100%;

      transition:
        opacity 0.5s ease,
        transform 0.5s ease;
    }

    .fade-out {
      opacity: 0;
      transform: translateY(-10px);
    }

    .center-content {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .content {
      width: min(850px, 90vw);

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 35px;
    }

    /* ============================================================
       GREETING
       ============================================================ */

    #greeting {
      font-size: clamp(3rem, 7vw, 6rem);

      font-weight: 500;

      letter-spacing: -0.04em;

      text-shadow:
        0 2px 20px rgba(0, 0, 0, 0.35);
    }

    /* ============================================================
       TITLES
       ============================================================ */

    .scene-title {
      margin: 0;

      font-size: clamp(2.5rem, 5vw, 4.5rem);

      font-weight: 500;

      letter-spacing: -0.04em;

      text-shadow:
        0 2px 20px rgba(0, 0, 0, 0.35);
    }

    /* ============================================================
       SLEEP RATING
       ============================================================ */

    #stars {
      display: flex;
      gap: 12px;
    }

    .star {
      border: none;
      background: transparent;

      padding: 0;

      color: rgba(255, 255, 255, 0.4);

      font-size: clamp(3rem, 6vw, 5rem);

      line-height: 1;

      cursor: pointer;

      transition:
        color 0.15s ease,
        transform 0.15s ease;
    }

    .star:hover {
      transform: scale(1.12);
    }

    .star.selected {
      color: #ffd85c;
    }

    /* ============================================================
       GOAL INPUT
       ============================================================ */

    #goal-input {
      width: 100%;

      min-height: 160px;

      padding: 22px 25px;

      resize: none;

      border: none;
      outline: none;

      border-radius: 18px;

      font-family: inherit;

      font-size: 1.35rem;

      line-height: 1.5;

      color: #222;

      background: rgba(255, 255, 255, 0.92);

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.2);
    }

    #goal-input:focus {
      background: white;
    }

    #goal-input::placeholder {
      color: #777;
    }

    /* ============================================================
       BUTTONS
       ============================================================ */

    .action-button,
    .small-button {
      border: none;

      font-family: inherit;

      color: white;

      background: rgba(255, 255, 255, 0.18);

      backdrop-filter: blur(10px);

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .action-button {
      padding: 13px 28px;

      border-radius: 999px;

      font-size: 1rem;

      font-weight: 500;
    }

    .small-button {
      padding: 7px 11px;

      border-radius: 9px;

      font-size: 0.78rem;
    }

    .action-button:hover,
    .small-button:hover {
      background: rgba(255, 255, 255, 0.3);

      transform: translateY(-1px);
    }

    /* ============================================================
       MAIN DASHBOARD
       ============================================================ */

    #main-screen {
      position: absolute;
      inset: 0;

      overflow-y: auto;

      padding:
        28px
        30px
        70px;
    }

    #dashboard-inner {
      width: min(1050px, 92vw);

      margin: 0 auto;
    }

    /* ============================================================
       TODAY'S GOAL
       ============================================================ */

    #daily-goal {
      width: 100%;

      padding: 25px 32px 28px;

      margin-bottom: 22px;

      border-radius: 22px;

      text-align: center;

      cursor: pointer;

      background: rgba(0, 0, 0, 0.20);

      backdrop-filter: blur(14px);

      box-shadow:
        0 12px 38px rgba(0, 0, 0, 0.15);

      text-shadow:
        0 2px 12px rgba(0, 0, 0, 0.35);

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    #daily-goal:hover {
      transform: scale(1.005);

      background:
        rgba(0, 0, 0, 0.26);
    }

    #daily-goal-label {
      margin-bottom: 8px;

      font-size: 0.72rem;

      text-transform: uppercase;

      letter-spacing: 0.14em;

      opacity: 0.6;
    }

    #daily-goal-text {
      font-size: clamp(1.65rem, 3vw, 2.6rem);

      line-height: 1.3;

      font-weight: 500;

      letter-spacing: -0.02em;
    }

    /* ============================================================
       WIDGET GRID
       ============================================================ */

    #widget-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 14px;
    }

    .widget {
      min-height: 165px;

      padding: 16px;

      border-radius: 17px;

      background: rgba(0, 0, 0, 0.19);

      backdrop-filter: blur(13px);

      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.12);
    }

    .widget-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 10px;
    }

    .widget-title {
      margin: 0;

      font-size: 0.76rem;

      font-weight: 500;

      text-transform: uppercase;

      letter-spacing: 0.11em;

      opacity: 0.63;
    }

    .widget-list {
      display: flex;

      flex-direction: column;

      gap: 6px;

      margin: 0;
      padding: 0;

      list-style: none;
    }

    .widget-list li a {
      display: block;

      padding: 8px 10px;

      border-radius: 9px;

      color: white;

      text-decoration: none;

      background:
        rgba(255, 255, 255, 0.06);

      font-size: 0.9rem;

      line-height: 1.3;

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .widget-list li a:hover {
      background:
        rgba(255, 255, 255, 0.13);

      transform: translateX(2px);
    }

    .empty-state {
      font-size: 0.88rem;

      opacity: 0.5;

      padding: 8px 2px;
    }

    /* ============================================================
       DODGERS
       ============================================================ */

    #dodgers-widget {
      min-height: 240px;
    }

    #dodgers {
      width: 100%;

      min-height: 185px;
    }

    /* ============================================================
       EDITOR
       ============================================================ */

    #editor-backdrop {
      position: fixed;

      inset: 0;

      z-index: 100;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(0, 0, 0, 0.55);

      backdrop-filter: blur(8px);
    }

    #editor {
      width: min(520px, 95vw);

      max-height: 90vh;

      overflow-y: auto;

      padding: 24px;

      border-radius: 20px;

      background:
        rgba(25, 25, 25, 0.96);

      box-shadow:
        0 20px 70px rgba(0, 0, 0, 0.4);
    }

    #editor h2 {
      margin: 0 0 5px;

      font-size: 1.4rem;

      font-weight: 500;
    }

    #editor-subtitle {
      margin: 0 0 18px;

      font-size: 0.9rem;

      opacity: 0.6;
    }

    .edit-item {
      display: grid;

      grid-template-columns:
        1fr 1fr auto;

      gap: 7px;

      margin-bottom: 8px;
    }

    .edit-input {
      width: 100%;

      min-width: 0;

      padding: 9px 10px;

      border:
        1px solid
        rgba(255, 255, 255, 0.1);

      border-radius: 9px;

      outline: none;

      font-family: inherit;

      color: white;

      background:
        rgba(255, 255, 255, 0.07);
    }

    .edit-input:focus {
      border-color:
        rgba(255, 255, 255, 0.3);
    }

    .delete-item {
      border: none;

      width: 34px;

      border-radius: 9px;

      color:
        rgba(255, 255, 255, 0.7);

      background:
        rgba(255, 255, 255, 0.07);

      cursor: pointer;
    }

    .delete-item:hover {
      color: white;

      background:
        rgba(255, 90, 90, 0.25);
    }

    #add-item {
      width: 100%;

      margin-top: 5px;

      padding: 9px;

      border:
        1px dashed
        rgba(255, 255, 255, 0.18);

      border-radius: 9px;

      color:
        rgba(255, 255, 255, 0.75);

      background: transparent;

      cursor: pointer;
    }

    #add-item:hover {
      background:
        rgba(255, 255, 255, 0.06);
    }

    .editor-actions {
      display: flex;

      justify-content: flex-end;

      gap: 8px;

      margin-top: 20px;
    }

    /* ============================================================
       RESTART
       ============================================================ */

    #restart-button {
      position: fixed;

      right: 22px;

      bottom: 22px;

      z-index: 20;

      border: none;

      padding: 9px 15px;

      border-radius: 999px;

      font-family: inherit;

      font-size: 0.82rem;

      color:
        rgba(255, 255, 255, 0.78);

      background:
        rgba(0, 0, 0, 0.25);

      backdrop-filter: blur(10px);

      cursor: pointer;
    }

    #restart-button:hover {
      color: white;

      background:
        rgba(0, 0, 0, 0.4);
    }

    /* ============================================================
       MOBILE
       ============================================================ */

    @media (max-width: 700px) {

      #main-screen {
        padding:
          20px
          16px
          65px;
      }

      #widget-grid {
        grid-template-columns: 1fr;
      }

      .edit-item {
        grid-template-columns: 1fr;
      }

      .delete-item {
        width: 100%;
        padding: 8px;
      }

    }

  </style>
</head>

<body>

  <div id="background"></div>

  <div id="overlay"></div>

  <main id="scene"></main>


  <script>

    /* ============================================================
       SETTINGS
       ============================================================ */

    const WALLPAPERS = [
      "WSD_HS3.png"
    ];


    const DEFAULT_LISTS = {

      projects: [
        {
          title: "Project 1",
          url: "https://example.com"
        },
        {
          title: "Project 2",
          url: "https://example.com"
        }
      ],

      reading: [
        {
          title: "Article to read",
          url: "https://www.nytimes.com"
        },
        {
          title: "Another article",
          url: "https://www.theatlantic.com"
        }
      ],

      watching: [
        {
          title: "Video to watch",
          url: "https://www.youtube.com"
        },
        {
          title: "Show / movie",
          url: "https://www.netflix.com"
        }
      ]

    };


    const LIST_INFO = {

      projects: {
        title: "Projects",
        description:
          "Add projects you're actively working on."
      },

      reading: {
        title: "Reading List",
        description:
          "Save articles, papers, books, or anything you want to read."
      },

      watching: {
        title: "Watching List",
        description:
          "Save videos, shows, movies, or anything you want to watch."
      }

    };


    const background =
      document.getElementById(
        "background"
      );

    const scene =
      document.getElementById(
        "scene"
      );

    let currentScene = 0;


    /* ============================================================
       WALLPAPER
       ============================================================ */

    function randomWallpaper() {

      const index =
        Math.floor(
          Math.random() *
          WALLPAPERS.length
        );

      background.style.backgroundImage =
        `url("${WALLPAPERS[index]}")`;
    }

    randomWallpaper();


    /* ============================================================
       COOKIE FUNCTIONS
       ============================================================ */

    function getCookie(name) {

      const cookies =
        document.cookie.split("; ");

      const cookie =
        cookies.find(
          row =>
            row.startsWith(
              name + "="
            )
        );

      if (!cookie) {
        return null;
      }

      return decodeURIComponent(
        cookie.substring(
          name.length + 1
        )
      );
    }


    function setCookie(
      name,
      value,
      days = 365
    ) {

      const expiration =
        new Date();

      expiration.setTime(
        expiration.getTime() +
        days *
        24 *
        60 *
        60 *
        1000
      );

      document.cookie =
        `${name}=${encodeURIComponent(
          value
        )}; expires=${expiration.toUTCString()}; path=/; SameSite=Lax`;
    }


    function deleteCookie(name) {

      document.cookie =
        `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; SameSite=Lax`;
    }


    /* ============================================================
       DATE
       ============================================================ */

    function getToday() {

      const date =
        new Date();

      const year =
        date.getFullYear();

      const month =
        String(
          date.getMonth() + 1
        ).padStart(2, "0");

      const day =
        String(
          date.getDate()
        ).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }


    /* ============================================================
       GREETING
       ============================================================ */

    function getGreeting() {

      const hour =
        new Date().getHours();

      if (hour < 12) {
        return "Good morning, Jonah";
      }

      if (hour < 17) {
        return "Good afternoon, Jonah";
      }

      return "Good evening, Jonah";
    }


    /* ============================================================
       SLEEP DATA
       ============================================================ */

    function getSleepRatings() {

      const cookie =
        getCookie(
          "sleepRatings"
        );

      if (!cookie) {
        return {};
      }

      try {

        return JSON.parse(
          cookie
        );

      } catch {

        return {};

      }

    }


    function saveSleepRating(
      rating
    ) {

      const data =
        getSleepRatings();

      data[getToday()] = {

        rating:

          rating,

        timestamp:
          new Date()
            .toISOString()

      };

      setCookie(
        "sleepRatings",
        JSON.stringify(
          data
        )
      );

    }


    /* ============================================================
       GOAL DATA
       ============================================================ */

    function getDailyGoals() {

      const cookie =
        getCookie(
          "dailyGoals"
        );

      if (!cookie) {
        return {};
      }

      try {

        return JSON.parse(
          cookie
        );

      } catch {

        return {};

      }

    }


    function getTodayGoal() {

      const goals =
        getDailyGoals();

      const today =
        getToday();

      return (
        goals[today]?.goal ||
        null
      );
    }


    function saveDailyGoal(
      goal
    ) {

      const goals =
        getDailyGoals();

      const today =
        getToday();

      goals[today] = {

        goal: goal,

        timestamp:
          new Date()
            .toISOString()

      };


      setCookie(
        "dailyGoals",
        JSON.stringify(
          goals
        )
      );


      /*
       * Entering today's goal completes
       * the morning routine.
       */

      setCookie(
        "goalCreated",
        today
      );

    }


    function hasCreatedGoalToday() {

      return (
        getCookie(
          "goalCreated"
        ) ===
        getToday()
      );

    }


    /* ============================================================
       LIST STORAGE — COOKIES
       ============================================================ */

    function getList(type) {

      const cookie =
        getCookie(
          `morning-${type}`
        );


      /*
       * First visit:
       * return starter items.
       */

      if (!cookie) {

        return DEFAULT_LISTS[type]
          .map(
            item => ({
              ...item
            })
          );

      }


      try {

        return JSON.parse(
          cookie
        );

      } catch {

        return DEFAULT_LISTS[type]
          .map(
            item => ({
              ...item
            })
          );

      }

    }


    function saveList(
      type,
      items
    ) {

      /*
       * Store the entire list as JSON
       * in a one-year cookie.
       */

      setCookie(
        `morning-${type}`,
        JSON.stringify(
          items
        )
      );

    }


    /* ============================================================
       ESCAPE HTML
       ============================================================ */

    function escapeHTML(
      text
    ) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        text;

      return div.innerHTML;

    }


    /* ============================================================
       TRANSITION
       ============================================================ */

    function transitionTo(
      html,
      callback
    ) {

      scene.classList.add(
        "fade-out"
      );


      setTimeout(() => {

        scene.innerHTML =
          html;

        scene.classList.remove(
          "fade-out"
        );


        if (callback) {
          callback();
        }

      }, 500);

    }


    /* ============================================================
       GREETING
       ============================================================ */

    function showGreeting() {

      currentScene = 0;


      transitionTo(`

        <div class="center-content">

          <div id="greeting">

            ${getGreeting()}

          </div>

        </div>

      `);

    }


    /* ============================================================
       SLEEP
       ============================================================ */

    function showSleepRating() {

      currentScene = 1;


      transitionTo(`

        <div class="center-content">

          <div class="content">

            <h1 class="scene-title">
              How did you sleep?
            </h1>

            <div id="stars">

              <button
                class="star"
                data-rating="1"
              >★</button>

              <button
                class="star"
                data-rating="2"
              >★</button>

              <button
                class="star"
                data-rating="3"
              >★</button>

              <button
                class="star"
                data-rating="4"
              >★</button>

              <button
                class="star"
                data-rating="5"
              >★</button>

            </div>

          </div>

        </div>

      `, setupSleepRating);

    }


    function setupSleepRating() {

      const stars =
        document.querySelectorAll(
          ".star"
        );


      stars.forEach(
        star => {

          star.addEventListener(
            "mouseenter",
            () => {

              const rating =
                Number(
                  star.dataset.rating
                );


              stars.forEach(
                s => {

                  s.classList.toggle(
                    "selected",

                    Number(
                      s.dataset.rating
                    ) <= rating
                  );

                }
              );

            }
          );


          star.addEventListener(
            "click",
            event => {

              event.stopPropagation();


              const rating =
                Number(
                  star.dataset.rating
                );


              saveSleepRating(
                rating
              );


              stars.forEach(
                s => {

                  s.classList.toggle(
                    "selected",

                    Number(
                      s.dataset.rating
                    ) <= rating
                  );

                }
              );


              setTimeout(
                showGoal,
                600
              );

            }
          );

        }
      );

    }


    /* ============================================================
       GOAL INPUT
       ============================================================ */

    function showGoal(
      existingGoal = ""
    ) {

      currentScene = 2;


      const editing =
        Boolean(
          existingGoal
        );


      transitionTo(`

        <div class="center-content">

          <div class="content">

            <h1 class="scene-title">

              ${
                editing
                  ? "Edit your goal"
                  : "What's your goal for today?"
              }

            </h1>


            <textarea
              id="goal-input"
              maxlength="500"
              placeholder="Write your goal..."
            ></textarea>


            <button
              id="goal-submit"
              class="action-button"
            >

              ${
                editing
                  ? "Save"
                  : "Continue"
              }

            </button>

          </div>

        </div>

      `, () => {

        const input =
          document.getElementById(
            "goal-input"
          );

        const button =
          document.getElementById(
            "goal-submit"
          );


        input.value =
          existingGoal;

        input.focus();


        function submitGoal() {

          const goal =
            input.value.trim();


          if (!goal) {

            input.focus();

            return;

          }


          saveDailyGoal(
            goal
          );


          showMainScreen(
            goal
          );

        }


        button.addEventListener(
          "click",
          event => {

            event.stopPropagation();

            submitGoal();

          }
        );


        input.addEventListener(
          "keydown",
          event => {

            if (
              event.key === "Enter" &&
              !event.shiftKey
            ) {

              event.preventDefault();

              submitGoal();

            }

          }
        );

      });

    }


    /* ============================================================
       LIST WIDGET
       ============================================================ */

    function renderListWidget(
      type,
      title
    ) {

      const items =
        getList(type);


      return `

        <div class="widget-header">

          <h2 class="widget-title">
            ${title}
          </h2>

          <button
            class="small-button edit-widget"
            data-type="${type}"
          >
            Edit
          </button>

        </div>


        ${
          items.length

            ? `

              <ul class="widget-list">

                ${
                  items
                    .map(
                      item => `

                        <li>

                          <a
                            href="${escapeHTML(
                              item.url
                            )}"
                            target="_blank"
                            rel="noopener noreferrer"
                          >

                            ${escapeHTML(
                              item.title
                            )}

                          </a>

                        </li>

                      `
                    )
                    .join("")
                }

              </ul>

            `

            : `

              <div class="empty-state">
                Nothing here yet.
              </div>

            `
        }

      `;

    }


    /* ============================================================
       MAIN DASHBOARD
       ============================================================ */

    function showMainScreen(
      goal
    ) {

      currentScene = 3;


      transitionTo(`

        <div id="main-screen">

          <div id="dashboard-inner">


            <!-- TODAY'S GOAL -->

            <div
              id="daily-goal"
              title="Click to edit"
            >

              <div id="daily-goal-label">
                Today's Goal
              </div>

              <div id="daily-goal-text">
                ${escapeHTML(
                  goal
                )}
              </div>

            </div>


            <!-- WIDGET GRID -->

            <div id="widget-grid">


              <!-- PROJECTS -->

              <section class="widget">

                ${renderListWidget(
                  "projects",
                  "Projects"
                )}

              </section>


              <!-- READING -->

              <section class="widget">

                ${renderListWidget(
                  "reading",
                  "Reading List"
                )}

              </section>


              <!-- WATCHING -->

              <section class="widget">

                ${renderListWidget(
                  "watching",
                  "Watching List"
                )}

              </section>


              <!-- DODGERS -->

              <section
                class="widget"
                id="dodgers-widget"
              >

                <div class="widget-header">

                  <h2 class="widget-title">
                    Dodgers
                  </h2>

                </div>


                <div
                  class="scorestream-widget-container"
                  data-ss_widget_type="vertScoreboard"
                  data-user-widget-id="59491"
                  id="dodgers"
                ></div>

              </section>


            </div>

          </div>

        </div>


        <button
          id="restart-button"
        >
          Restart
        </button>

      `, () => {

        setupMainScreen();


        /*
         * Load ScoreStream after the widget
         * has been inserted.
         */

        const scoreScript =
          document.createElement(
            "script"
          );

        scoreScript.async =
          true;

        scoreScript.type =
          "text/javascript";

        scoreScript.src =
          "https://scorestream.com/apiJsCdn/widgets/embed.js";


        document.body.appendChild(
          scoreScript
        );

      });

    }


    /* ============================================================
       MAIN SCREEN INTERACTIONS
       ============================================================ */

    function setupMainScreen() {

      /*
       * Today's Goal → Edit
       */

      document
        .getElementById(
          "daily-goal"
        )
        .addEventListener(
          "click",
          event => {

            event.stopPropagation();


            showGoal(
              getTodayGoal() || ""
            );

          }
        );


      /*
       * Restart
       */

      document
        .getElementById(
          "restart-button"
        )
        .addEventListener(
          "click",
          event => {

            event.stopPropagation();


            const confirmed =
              window.confirm(
                "Are you sure you want to restart your morning routine?"
              );


            if (confirmed) {

              restartRoutine();

            }

          }
        );


      /*
       * List editing
       */

      document
        .querySelectorAll(
          ".edit-widget"
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              event => {

                event.stopPropagation();


                openListEditor(
                  button.dataset.type
                );

              }
            );

          }
        );

    }


    /* ============================================================
       LIST EDITOR
       ============================================================ */

    function openListEditor(
      type
    ) {

      const info =
        LIST_INFO[type];


      /*
       * Work on a copy so Cancel
       * does not modify anything.
       */

      const items =
        getList(type).map(
          item => ({
            ...item
          })
        );


      const backdrop =
        document.createElement(
          "div"
        );

      backdrop.id =
        "editor-backdrop";


      backdrop.innerHTML = `

        <div id="editor">

          <h2>
            Edit ${info.title}
          </h2>

          <p id="editor-subtitle">
            ${info.description}
          </p>


          <div
            id="editor-items"
          ></div>


          <button
            id="add-item"
          >
            + Add item
          </button>


          <div
            class="editor-actions"
          >

            <button
              class="small-button"
              id="cancel-editor"
            >
              Cancel
            </button>


            <button
              class="small-button"
              id="save-editor"
            >
              Save
            </button>

          </div>

        </div>

      `;


      document.body.appendChild(
        backdrop
      );


      const itemContainer =
        document.getElementById(
          "editor-items"
        );


      function renderEditorItems() {

        itemContainer.innerHTML =
          "";


        items.forEach(
          (item, index) => {

            const row =
              document.createElement(
                "div"
              );

            row.className =
              "edit-item";


            row.innerHTML = `

              <input
                class="edit-input"
                data-field="title"
                data-index="${index}"
                placeholder="Title"
                value="${escapeHTML(
                  item.title || ""
                )}"
              >


              <input
                class="edit-input"
                data-field="url"
                data-index="${index}"
                placeholder="https://..."
                value="${escapeHTML(
                  item.url || ""
                )}"
              >


              <button
                class="delete-item"
                data-index="${index}"
                title="Delete"
              >
                ×
              </button>

            `;


            itemContainer.appendChild(
              row
            );

          }
        );


        itemContainer
          .querySelectorAll(
            ".delete-item"
          )
          .forEach(
            button => {

              button.addEventListener(
                "click",
                () => {

                  items.splice(
                    Number(
                      button.dataset.index
                    ),
                    1
                  );


                  renderEditorItems();

                }
              );

            }
          );

      }


      renderEditorItems();


      /*
       * Add item
       */

      document
        .getElementById(
          "add-item"
        )
        .addEventListener(
          "click",
          () => {

            items.push({
              title: "",
              url: ""
            });


            renderEditorItems();


            const titleInputs =
              itemContainer
                .querySelectorAll(
                  '[data-field="title"]'
                );


            titleInputs[
              titleInputs.length - 1
            ]?.focus();

          }
        );


      /*
       * Cancel
       */

      document
        .getElementById(
          "cancel-editor"
        )
        .addEventListener(
          "click",
          () => {

            backdrop.remove();

          }
        );


      /*
       * Save
       */

      document
        .getElementById(
          "save-editor"
        )
        .addEventListener(
          "click",
          () => {

            const updatedItems =
              [];


            itemContainer
              .querySelectorAll(
                ".edit-item"
              )
              .forEach(
                row => {

                  const title =
                    row
                      .querySelector(
                        '[data-field="title"]'
                      )
                      .value
                      .trim();


                  const url =
                    row
                      .querySelector(
                        '[data-field="url"]'
                      )
                      .value
                      .trim();


                  if (title) {

                    updatedItems.push({
                      title,
                      url:
                        url || "#"
                    });

                  }

                }
              );


            saveList(
              type,
              updatedItems
            );


            backdrop.remove();


            refreshDashboard();

          }
        );

    }


    /* ============================================================
       REFRESH
       ============================================================ */

    function refreshDashboard() {

      const goal =
        getTodayGoal();


      if (goal) {

        showMainScreen(
          goal
        );

      }

    }


    /* ============================================================
       RESTART
       ============================================================ */

    function restartRoutine() {

      const goals =
        getDailyGoals();

      const today =
        getToday();


      delete goals[today];


      if (
        Object.keys(
          goals
        ).length
      ) {

        setCookie(
          "dailyGoals",
          JSON.stringify(
            goals
          )
        );

      } else {

        deleteCookie(
          "dailyGoals"
        );

      }


      deleteCookie(
        "goalCreated"
      );


      showGreeting();

    }


    /* ============================================================
       GREETING CLICK
       ============================================================ */

    document.addEventListener(
      "click",
      () => {

        if (
          currentScene === 0
        ) {

          showSleepRating();

        }

      }
    );


    /* ============================================================
       STARTUP
       ============================================================ */

    function initialize() {

      if (
        hasCreatedGoalToday()
      ) {

        const goal =
          getTodayGoal();


        if (goal) {

          showMainScreen(
            goal
          );

          return;

        }


        deleteCookie(
          "goalCreated"
        );

      }


      showGreeting();

    }


    initialize();

  </script>

</body>
</html>
