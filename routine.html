<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Morning Routine</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      background: #111;
      color: white;
    }

    /* ============================================================
       BACKGROUND
       ============================================================ */

    #background {
      position: fixed;
      inset: 0;

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      z-index: 0;
    }

    #overlay {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.25);

      z-index: 1;
    }

    /* ============================================================
       MAIN SCENE
       ============================================================ */

    #scene {
      position: relative;

      z-index: 2;

      width: 100%;
      height: 100%;

      transition:
        opacity 0.5s ease,
        transform 0.5s ease;
    }

    .fade-out {
      opacity: 0;
      transform: translateY(-10px);
    }

    .center-content {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .content {
      width: min(850px, 90vw);

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 35px;
    }

    /* ============================================================
       GREETING
       ============================================================ */

    #greeting {
      font-size: clamp(3rem, 7vw, 6rem);

      font-weight: 500;

      letter-spacing: -0.04em;

      text-shadow:
        0 2px 20px rgba(0, 0, 0, 0.35);
    }

    /* ============================================================
       TITLES
       ============================================================ */

    .scene-title {
      margin: 0;

      font-size: clamp(2.5rem, 5vw, 4.5rem);

      font-weight: 500;

      letter-spacing: -0.04em;

      text-shadow:
        0 2px 20px rgba(0, 0, 0, 0.35);
    }

    /* ============================================================
       SLEEP RATING
       ============================================================ */

    #stars {
      display: flex;

      gap: 12px;
    }

    .star {
      border: none;

      background: transparent;

      padding: 0;

      color:
        rgba(255, 255, 255, 0.4);

      font-size:
        clamp(3rem, 6vw, 5rem);

      line-height: 1;

      cursor: pointer;

      transition:
        color 0.15s ease,
        transform 0.15s ease;
    }

    .star:hover {
      transform: scale(1.12);
    }

    .star.selected {
      color: #ffd85c;
    }

    /* ============================================================
       GOAL INPUT
       ============================================================ */

    #goal-input {
      width: 100%;

      min-height: 160px;

      padding: 22px 25px;

      resize: none;

      border: none;
      outline: none;

      border-radius: 18px;

      font-family: inherit;

      font-size: 1.35rem;

      line-height: 1.5;

      color: #222;

      background:
        rgba(255, 255, 255, 0.92);

      box-shadow:
        0 10px 40px
        rgba(0, 0, 0, 0.2);
    }

    #goal-input:focus {
      background: white;
    }

    #goal-input::placeholder {
      color: #777;
    }

    /* ============================================================
       BUTTONS
       ============================================================ */

    .action-button,
    .small-button {
      border: none;

      font-family: inherit;

      color: white;

      background:
        rgba(255, 255, 255, 0.18);

      backdrop-filter: blur(10px);

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .action-button {
      padding: 13px 28px;

      border-radius: 999px;

      font-size: 1rem;

      font-weight: 500;
    }

    .small-button {
      padding: 6px 9px;

      border-radius: 7px;

      font-size: 0.7rem;
    }

    .action-button:hover,
    .small-button:hover {
      background:
        rgba(255, 255, 255, 0.3);

      transform: translateY(-1px);
    }

    /* ============================================================
       MAIN DASHBOARD
       ============================================================ */

    #main-screen {
      position: absolute;

      inset: 0;

      overflow: hidden;

      padding: 30px;
    }

    #dashboard-inner {
      width: 100%;
      height: 100%;
    }

    /* ============================================================
       TODAY'S GOAL — BOTTOM
       ============================================================ */

    #daily-goal {
      position: absolute;

      bottom: 9%;
      left: 50%;

      transform:
        translateX(-50%);

      width:
        min(750px, 65vw);

      text-align: center;

      cursor: pointer;

      text-shadow:
        0 3px 18px
        rgba(0, 0, 0, 0.55);

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    #daily-goal:hover {
      transform:
        translateX(-50%)
        scale(1.02);
    }

    #daily-goal-label {
      margin-bottom: 8px;

      font-size: 0.75rem;

      text-transform: uppercase;

      letter-spacing: 0.14em;

      opacity: 0.65;
    }

    #daily-goal-text {
      font-size:
        clamp(2rem, 3.6vw, 3.1rem);

      line-height: 1.3;

      font-weight: 500;

      letter-spacing: -0.025em;
    }

    /* ============================================================
       PROJECTS — TOP LEFT
       ============================================================ */

    #projects-widget {
      position: absolute;

      left: 30px;
      top: 30px;

      width:
        min(300px, 27vw);

      height: 45vh;

      min-height: 300px;

      max-height: 500px;

      padding: 18px;

      border-radius: 18px;

      background:
        rgba(0, 0, 0, 0.20);

      backdrop-filter: blur(12px);

      box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.12);
    }

    /* ============================================================
       DODGERS — TOP RIGHT
       ============================================================ */

    #dodgers-widget {
      position: absolute;

      right: 30px;
      top: 30px;

      width:
        min(300px, 27vw);

      height: 70vh;

      min-height: 400px;

      padding: 18px;

      border-radius: 18px;

      background:
        rgba(0, 0, 0, 0.20);

      backdrop-filter: blur(12px);

      box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.12);

      cursor: pointer;

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    #dodgers-widget:hover {
      transform: scale(1.01);

      background:
        rgba(0, 0, 0, 0.27);
    }

    /* ============================================================
       WIDGET CONTENT
       ============================================================ */

    .widget-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 8px;

      margin-bottom: 12px;
    }

    .widget-title {
      margin: 0;

      font-size: 0.75rem;

      font-weight: 500;

      text-transform: uppercase;

      letter-spacing: 0.1em;

      opacity: 0.62;
    }

    .widget-list {
      display: flex;

      flex-direction: column;

      gap: 7px;

      margin: 0;

      padding: 0;

      list-style: none;
    }

    .widget-list li a {
      display: block;

      padding: 9px 11px;

      border-radius: 9px;

      color: white;

      text-decoration: none;

      background:
        rgba(255, 255, 255, 0.06);

      font-size: 0.9rem;

      line-height: 1.3;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .widget-list li a:hover {
      background:
        rgba(255, 255, 255, 0.13);

      transform:
        translateX(2px);
    }

    .empty-state {
      font-size: 0.85rem;

      opacity: 0.5;

      padding: 5px 2px;
    }

    /* ============================================================
       DODGERS SCOREBOARD
       ============================================================ */

    #dodgers {
      width: 100%;

      height:
        calc(100% - 35px);

      min-height: 330px;

      overflow: hidden;

      pointer-events: none;
    }

    /* ============================================================
       DODGERS POPUP
       ============================================================ */

    #dodgers-popup-backdrop {
      position: fixed;

      inset: 0;

      z-index: 200;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 30px;

      background:
        rgba(0, 0, 0, 0.65);

      backdrop-filter: blur(10px);
    }

    #dodgers-popup {
      position: relative;

      width:
        min(900px, 92vw);

      height:
        min(86vh, 850px);

      padding: 25px;

      border-radius: 22px;

      background:
        rgba(25, 25, 25, 0.97);

      box-shadow:
        0 25px 80px
        rgba(0, 0, 0, 0.5);

      overflow: hidden;
    }

    #dodgers-popup-title {
      margin:
        0 0 15px;

      font-size: 1.1rem;

      font-weight: 500;

      text-transform: uppercase;

      letter-spacing: 0.1em;

      opacity: 0.65;
    }

    /* ============================================================
       EMBEDDED RECAP VIDEO
       ============================================================ */

    #dodgers-popup-video-wrapper {
      width: 82%;

      max-width: 760px;

      margin: 0 auto;
    }

    #dodgers-popup-video {
      width: 100%;

      aspect-ratio: 16 / 9;

      border: none;

      border-radius: 14px;

      background: #000;

      display: block;
    }

    #dodgers-video-loading {
      width: 100%;

      aspect-ratio: 16 / 9;

      border-radius: 14px;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        rgba(255, 255, 255, 0.04);

      color:
        rgba(255, 255, 255, 0.55);

      font-size: 0.95rem;
    }

    /* ============================================================
       VIDEO TITLE
       ============================================================ */

    #dodgers-popup-recap {
      width: 82%;

      max-width: 760px;

      margin:
        14px auto 0;
    }

    #dodgers-recap-title {
      margin-bottom: 7px;

      font-size: 0.7rem;

      text-transform: uppercase;

      letter-spacing: 0.1em;

      opacity: 0.6;
    }

    #dodgers-recap-content {
      min-height: 38px;
    }

    #dodgers-recap-link {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 12px;

      padding: 9px 11px;

      border-radius: 9px;

      color: white;

      text-decoration: none;

      background:
        rgba(255, 255, 255, 0.08);

      font-size: 0.85rem;

      line-height: 1.3;

      transition:
        background 0.2s ease;
    }

    #dodgers-recap-link:hover {
      background:
        rgba(255, 255, 255, 0.16);
    }

    /* ============================================================
       POPUP LINKS
       ============================================================ */

    #dodgers-popup-links {
      position: absolute;

      left: 25px;
      right: 25px;

      bottom: 20px;

      display: flex;

      gap: 10px;
    }

    .dodgers-popup-link {
      flex: 1;

      padding: 10px 14px;

      border-radius: 10px;

      color: white;

      text-decoration: none;

      text-align: center;

      font-size: 0.85rem;

      background:
        rgba(255, 255, 255, 0.1);

      transition:
        background 0.2s ease;
    }

    .dodgers-popup-link:hover {
      background:
        rgba(255, 255, 255, 0.18);
    }

    /* ============================================================
       CLOSE BUTTON
       ============================================================ */

    #dodgers-popup-close {
      position: absolute;

      top: 18px;
      right: 20px;

      width: 32px;
      height: 32px;

      border: none;

      border-radius: 50%;

      color: white;

      background:
        rgba(255, 255, 255, 0.1);

      font-size: 1.1rem;

      cursor: pointer;

      z-index: 5;
    }

    #dodgers-popup-close:hover {
      background:
        rgba(255, 255, 255, 0.2);
    }

    /* ============================================================
       PROJECT EDITOR
       ============================================================ */

    #editor-backdrop {
      position: fixed;

      inset: 0;

      z-index: 100;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(0, 0, 0, 0.55);

      backdrop-filter: blur(8px);
    }

    #editor {
      width:
        min(520px, 95vw);

      max-height: 90vh;

      overflow-y: auto;

      padding: 24px;

      border-radius: 20px;

      background:
        rgba(25, 25, 25, 0.96);

      box-shadow:
        0 20px 70px
        rgba(0, 0, 0, 0.4);
    }

    #editor h2 {
      margin:
        0 0 5px;

      font-size: 1.4rem;

      font-weight: 500;
    }

    #editor-subtitle {
      margin:
        0 0 18px;

      font-size: 0.9rem;

      opacity: 0.6;
    }

    .edit-item {
      display: grid;

      grid-template-columns:
        1fr 1fr auto;

      gap: 7px;

      margin-bottom: 8px;
    }

    .edit-input {
      width: 100%;

      min-width: 0;

      padding: 9px 10px;

      border:
        1px solid
        rgba(255, 255, 255, 0.1);

      border-radius: 9px;

      outline: none;

      font-family: inherit;

      color: white;

      background:
        rgba(255, 255, 255, 0.07);
    }

    .edit-input:focus {
      border-color:
        rgba(255, 255, 255, 0.3);
    }

    .delete-item {
      border: none;

      width: 34px;

      border-radius: 9px;

      color:
        rgba(255, 255, 255, 0.7);

      background:
        rgba(255, 255, 255, 0.07);

      cursor: pointer;
    }

    .delete-item:hover {
      color: white;

      background:
        rgba(255, 90, 90, 0.25);
    }

    #add-item {
      width: 100%;

      margin-top: 5px;

      padding: 9px;

      border:
        1px dashed
        rgba(255, 255, 255, 0.18);

      border-radius: 9px;

      color:
        rgba(255, 255, 255, 0.75);

      background: transparent;

      cursor: pointer;
    }

    #add-item:hover {
      background:
        rgba(255, 255, 255, 0.06);
    }

    .editor-actions {
      display: flex;

      justify-content: flex-end;

      gap: 8px;

      margin-top: 20px;
    }

    /* ============================================================
       RESTART
       ============================================================ */

    #restart-button {
      position: fixed;

      right: 22px;
      bottom: 22px;

      z-index: 20;

      border: none;

      padding: 8px 14px;

      border-radius: 999px;

      font-family: inherit;

      font-size: 0.78rem;

      color:
        rgba(255, 255, 255, 0.75);

      background:
        rgba(0, 0, 0, 0.25);

      backdrop-filter: blur(10px);

      cursor: pointer;
    }

    #restart-button:hover {
      color: white;

      background:
        rgba(0, 0, 0, 0.4);
    }

    /* ============================================================
       MOBILE
       ============================================================ */

    @media (max-width: 700px) {

      #main-screen {
        overflow-y: auto;

        padding:
          20px
          16px
          70px;
      }

      #daily-goal {
        position: relative;

        top: auto;
        left: auto;
        bottom: auto;

        transform: none;

        width: 100%;

        margin-top: 30px;
      }

      #daily-goal:hover {
        transform: scale(1.01);
      }

      #projects-widget,
      #dodgers-widget {
        position: relative;

        top: auto;
        left: auto;
        right: auto;
        bottom: auto;

        width: 100%;

        margin-bottom: 15px;
      }

      #dodgers-widget {
        min-height: 400px;
      }

      #dodgers-popup {
        width: 95vw;

        height: 90vh;

        padding: 18px;
      }

      #dodgers-popup-video-wrapper,
      #dodgers-popup-recap {
        width: 100%;
      }

      #dodgers-popup-links {
        left: 18px;
        right: 18px;
      }

      #dodgers-popup-close {
        top: 12px;
        right: 12px;
      }

    }
  </style>
</head>

<body>

  <div id="background"></div>

  <div id="overlay"></div>

  <main id="scene"></main>


  <script>

    /* ============================================================
       SETTINGS
       ============================================================ */

    const WALLPAPERS = [
      "WSD_HS3.png"
    ];

    const DEFAULT_PROJECTS = [
      {
        title: "Project 1",
        url: "https://example.com"
      },
      {
        title: "Project 2",
        url: "https://example.com"
      }
    ];

    /*
     * Cloudflare Worker endpoint.
     */

    const DODGERS_RECAP_API =
      "https://routine.focatheseal.workers.dev/dodgers-recap";


    const background =
      document.getElementById(
        "background"
      );

    const scene =
      document.getElementById(
        "scene"
      );

    let currentScene = 0;


    /* ============================================================
       WALLPAPER
       ============================================================ */

    function randomWallpaper() {

      const index =
        Math.floor(
          Math.random() *
          WALLPAPERS.length
        );

      background.style.backgroundImage =
        `url("${WALLPAPERS[index]}")`;
    }

    randomWallpaper();


    /* ============================================================
       COOKIE FUNCTIONS
       ============================================================ */

    function getCookie(name) {

      const cookies =
        document.cookie.split("; ");

      const cookie =
        cookies.find(
          row =>
            row.startsWith(
              name + "="
            )
        );

      if (!cookie) {
        return null;
      }

      return decodeURIComponent(
        cookie.substring(
          name.length + 1
        )
      );
    }


    function setCookie(
      name,
      value,
      days = 365
    ) {

      const expiration =
        new Date();

      expiration.setTime(
        expiration.getTime() +
        days *
        24 *
        60 *
        60 *
        1000
      );

      document.cookie =
        `${name}=${encodeURIComponent(
          value
        )}; expires=${expiration.toUTCString()}; path=/; SameSite=Lax`;
    }


    function deleteCookie(name) {

      document.cookie =
        `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; SameSite=Lax`;
    }


    /* ============================================================
       DATE
       ============================================================ */

    function getToday() {

      const date =
        new Date();

      const year =
        date.getFullYear();

      const month =
        String(
          date.getMonth() + 1
        ).padStart(2, "0");

      const day =
        String(
          date.getDate()
        ).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }


    /* ============================================================
       GREETING
       ============================================================ */

    function getGreeting() {

      const hour =
        new Date().getHours();

      if (hour < 12) {
        return "Good morning, Jonah";
      }

      if (hour < 17) {
        return "Good afternoon, Jonah";
      }

      return "Good evening, Jonah";
    }


    /* ============================================================
       SLEEP DATA
       ============================================================ */

    function getSleepRatings() {

      const cookie =
        getCookie(
          "sleepRatings"
        );

      if (!cookie) {
        return {};
      }

      try {
        return JSON.parse(
          cookie
        );
      } catch {
        return {};
      }
    }


    function saveSleepRating(
      rating
    ) {

      const data =
        getSleepRatings();

      data[getToday()] = {
        rating,

        timestamp:
          new Date()
            .toISOString()
      };

      setCookie(
        "sleepRatings",
        JSON.stringify(data)
      );
    }


    /* ============================================================
       GOAL DATA
       ============================================================ */

    function getDailyGoals() {

      const cookie =
        getCookie(
          "dailyGoals"
        );

      if (!cookie) {
        return {};
      }

      try {
        return JSON.parse(
          cookie
        );
      } catch {
        return {};
      }
    }


    function getTodayGoal() {

      const goals =
        getDailyGoals();

      const today =
        getToday();

      return (
        goals[today]?.goal ||
        null
      );
    }


    function saveDailyGoal(
      goal
    ) {

      const goals =
        getDailyGoals();

      const today =
        getToday();

      goals[today] = {

        goal,

        timestamp:
          new Date()
            .toISOString()
      };

      setCookie(
        "dailyGoals",
        JSON.stringify(goals)
      );

      /*
       * Entering today's goal completes
       * the morning routine.
       */

      setCookie(
        "goalCreated",
        today
      );
    }


    function hasCreatedGoalToday() {

      return (
        getCookie(
          "goalCreated"
        ) ===
        getToday()
      );
    }


    /* ============================================================
       PROJECT STORAGE
       ============================================================ */

    function getProjects() {

      const cookie =
        getCookie(
          "morning-projects"
        );

      if (!cookie) {

        return DEFAULT_PROJECTS
          .map(
            project => ({
              ...project
            })
          );
      }

      try {

        return JSON.parse(
          cookie
        );

      } catch {

        return DEFAULT_PROJECTS
          .map(
            project => ({
              ...project
            })
          );
      }
    }


    function saveProjects(
      projects
    ) {

      setCookie(
        "morning-projects",
        JSON.stringify(projects)
      );
    }


    /* ============================================================
       HTML ESCAPING
       ============================================================ */

    function escapeHTML(
      text
    ) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        text;

      return div.innerHTML;
    }


    /* ============================================================
       TRANSITION
       ============================================================ */

    function transitionTo(
      html,
      callback
    ) {

      scene.classList.add(
        "fade-out"
      );

      setTimeout(() => {

        scene.innerHTML =
          html;

        scene.classList.remove(
          "fade-out"
        );

        if (callback) {
          callback();
        }

      }, 500);
    }


    /* ============================================================
       GREETING
       ============================================================ */

    function showGreeting() {

      currentScene = 0;

      transitionTo(`

        <div class="center-content">

          <div id="greeting">

            ${getGreeting()}

          </div>

        </div>

      `);
    }


    /* ============================================================
       SLEEP RATING
       ============================================================ */

    function showSleepRating() {

      currentScene = 1;

      transitionTo(`

        <div class="center-content">

          <div class="content">

            <h1 class="scene-title">
              How did you sleep?
            </h1>

            <div id="stars">

              <button
                class="star"
                data-rating="1"
              >
                ★
              </button>

              <button
                class="star"
                data-rating="2"
              >
                ★
              </button>

              <button
                class="star"
                data-rating="3"
              >
                ★
              </button>

              <button
                class="star"
                data-rating="4"
              >
                ★
              </button>

              <button
                class="star"
                data-rating="5"
              >
                ★
              </button>

            </div>

          </div>

        </div>

      `, setupSleepRating);
    }


    function setupSleepRating() {

      const stars =
        document.querySelectorAll(
          ".star"
        );

      stars.forEach(
        star => {

          star.addEventListener(
            "mouseenter",
            () => {

              const rating =
                Number(
                  star.dataset.rating
                );

              stars.forEach(
                s => {

                  s.classList.toggle(
                    "selected",

                    Number(
                      s.dataset.rating
                    ) <= rating
                  );

                }
              );
            }
          );


          star.addEventListener(
            "click",
            event => {

              event.stopPropagation();

              const rating =
                Number(
                  star.dataset.rating
                );

              saveSleepRating(
                rating
              );

              stars.forEach(
                s => {

                  s.classList.toggle(
                    "selected",

                    Number(
                      s.dataset.rating
                    ) <= rating
                  );

                }
              );

              setTimeout(
                showGoal,
                600
              );
            }
          );

        }
      );
    }


    /* ============================================================
       GOAL INPUT
       ============================================================ */

    function showGoal(
      existingGoal = ""
    ) {

      currentScene = 2;

      const editing =
        Boolean(
          existingGoal
        );

      transitionTo(`

        <div class="center-content">

          <div class="content">

            <h1 class="scene-title">

              ${
                editing
                  ? "Edit your goal"
                  : "What's your goal for today?"
              }

            </h1>

            <textarea
              id="goal-input"
              maxlength="500"
              placeholder="Write your goal..."
            ></textarea>

            <button
              id="goal-submit"
              class="action-button"
            >

              ${
                editing
                  ? "Save"
                  : "Continue"
              }

            </button>

          </div>

        </div>

      `, () => {

        const input =
          document.getElementById(
            "goal-input"
          );

        const button =
          document.getElementById(
            "goal-submit"
          );

        input.value =
          existingGoal;

        input.focus();


        function submitGoal() {

          const goal =
            input.value.trim();

          if (!goal) {

            input.focus();

            return;
          }

          saveDailyGoal(
            goal
          );

          showMainScreen(
            goal
          );
        }


        button.addEventListener(
          "click",
          event => {

            event.stopPropagation();

            submitGoal();

          }
        );


        input.addEventListener(
          "keydown",
          event => {

            if (
              event.key === "Enter" &&
              !event.shiftKey
            ) {

              event.preventDefault();

              submitGoal();

            }

          }
        );

      });
    }


    /* ============================================================
       PROJECT WIDGET
       ============================================================ */

    function renderProjects() {

      const projects =
        getProjects();

      return `

        <div class="widget-header">

          <h2 class="widget-title">
            Projects
          </h2>

          <button
            class="small-button"
            id="edit-projects"
          >
            Edit
          </button>

        </div>

        ${
          projects.length

            ? `

              <ul class="widget-list">

                ${
                  projects
                    .map(
                      project => `

                        <li>

                          <a
                            href="${escapeHTML(
                              project.url
                            )}"
                            target="_blank"
                            rel="noopener noreferrer"
                          >

                            ${escapeHTML(
                              project.title
                            )}

                          </a>

                        </li>

                      `
                    )
                    .join("")
                }

              </ul>

            `

            : `

              <div class="empty-state">
                No projects yet.
              </div>

            `
        }

      `;
    }


    /* ============================================================
       MAIN DASHBOARD
       ============================================================ */

    function showMainScreen(
      goal
    ) {

      currentScene = 3;

      transitionTo(`

        <div id="main-screen">

          <div id="dashboard-inner">

            <!-- PROJECTS -->

            <section
              id="projects-widget"
            >

              ${renderProjects()}

            </section>


            <!-- DODGERS -->

            <section
              id="dodgers-widget"
            >

              <div class="widget-header">

                <h2 class="widget-title">
                  Dodgers
                </h2>

              </div>

              <div
                class="scorestream-widget-container"
                data-ss_widget_type="vertScoreboard"
                data-user-widget-id="59491"
                id="dodgers"
              ></div>

            </section>


            <!-- TODAY'S GOAL -->

            <div
              id="daily-goal"
              title="Click to edit"
            >

              <div id="daily-goal-label">
                Today's Goal
              </div>

              <div id="daily-goal-text">

                ${escapeHTML(
                  goal
                )}

              </div>

            </div>

          </div>

        </div>


        <button
          id="restart-button"
        >
          Restart
        </button>

      `, () => {

        setupMainScreen();


        /*
         * Load ScoreStream exactly ONCE.
         */

        const scoreScript =
          document.createElement(
            "script"
          );

        scoreScript.async =
          true;

        scoreScript.type =
          "text/javascript";

        scoreScript.src =
          "https://scorestream.com/apiJsCdn/widgets/embed.js";

        document.body.appendChild(
          scoreScript
        );
      });
    }


    /* ============================================================
       MAIN SCREEN
       ============================================================ */

    function setupMainScreen() {

      document
        .getElementById(
          "daily-goal"
        )
        .addEventListener(
          "click",
          event => {

            event.stopPropagation();

            showGoal(
              getTodayGoal() || ""
            );

          }
        );


      document
        .getElementById(
          "restart-button"
        )
        .addEventListener(
          "click",
          event => {

            event.stopPropagation();

            const confirmed =
              window.confirm(
                "Are you sure you want to restart your morning routine?"
              );

            if (confirmed) {
              restartRoutine();
            }

          }
        );


      document
        .getElementById(
          "edit-projects"
        )
        .addEventListener(
          "click",
          event => {

            event.stopPropagation();

            openProjectEditor();

          }
        );


      document
        .getElementById(
          "dodgers-widget"
        )
        .addEventListener(
          "click",
          event => {

            event.stopPropagation();

            openDodgersPopup();

          }
        );
    }


    /* ============================================================
       GET LATEST DODGERS RECAP
       ============================================================ */

    async function getLatestDodgersRecap() {

      try {

        const response =
          await fetch(
            DODGERS_RECAP_API
          );

        if (!response.ok) {

          throw new Error(
            `Request failed: ${response.status}`
          );

        }

        return await response.json();

      } catch (error) {

        console.error(
          "Could not load Dodgers recap:",
          error
        );

        return null;
      }
    }


    /* ============================================================
       EXTRACT YOUTUBE VIDEO ID
       ============================================================ */

    function getYouTubeVideoId(
      url
    ) {

      try {

        const parsed =
          new URL(url);


        if (
          parsed.hostname ===
          "youtu.be"
        ) {

          return parsed.pathname
            .replace("/", "");

        }


        if (
          parsed.hostname.includes(
            "youtube.com"
          )
        ) {

          return parsed.searchParams
            .get("v");

        }


        return null;

      } catch {

        return null;

      }
    }


    /* ============================================================
       CLOSE POPUPS WITH ESCAPE
       ============================================================ */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key !== "Escape"
        ) {
          return;
        }


        const dodgersPopup =
          document.getElementById(
            "dodgers-popup-backdrop"
          );


        const editor =
          document.getElementById(
            "editor-backdrop"
          );


        /*
         * Close the topmost popup first.
         */

        if (dodgersPopup) {

          dodgersPopup.remove();

          return;

        }


        if (editor) {

          editor.remove();

        }

      }
    );


    /* ============================================================
       DODGERS POPUP
       ============================================================ */

    async function openDodgersPopup() {

      const backdrop =
        document.createElement(
          "div"
        );


      backdrop.id =
        "dodgers-popup-backdrop";


      backdrop.innerHTML = `

        <div
          id="dodgers-popup"
        >

          <button
            id="dodgers-popup-close"
            aria-label="Close"
          >
            ×
          </button>


          <h2 id="dodgers-popup-title">
            Dodgers
          </h2>


          <div
            id="dodgers-popup-video-wrapper"
          >

            <div
              id="dodgers-video-loading"
            >
              Loading latest game recap...
            </div>

          </div>


          <div
            id="dodgers-popup-recap"
          >

            <div
              id="dodgers-recap-title"
            >
              Latest Game Recap
            </div>


            <div
              id="dodgers-recap-content"
            >
              Loading...
            </div>

          </div>


          <div
            id="dodgers-popup-links"
          >

            <a
              class="dodgers-popup-link"
              href="https://www.mlb.com/dodgers"
              target="_blank"
              rel="noopener noreferrer"
            >
              Dodgers
            </a>


            <a
              class="dodgers-popup-link"
              href="https://mlbwebcast.com/los-angeles-dodgers-live/"
              target="_blank"
              rel="noopener noreferrer"
            >
              Live Stream
            </a>

          </div>

        </div>

      `;


      document.body.appendChild(
        backdrop
      );


      /*
       * Fetch latest recap.
       */

      const recap =
        await getLatestDodgersRecap();


      /*
       * Make sure the popup hasn't been
       * closed while the request was loading.
       */

      if (
        !document.getElementById(
          "dodgers-popup-backdrop"
        )
      ) {
        return;
      }


      const videoWrapper =
        document.getElementById(
          "dodgers-popup-video-wrapper"
        );


      const recapContent =
        document.getElementById(
          "dodgers-recap-content"
        );


      if (
        recap &&
        recap.url &&
        recap.title
      ) {

        const videoId =
          getYouTubeVideoId(
            recap.url
          );


        if (videoId) {

          videoWrapper.innerHTML = `

            <iframe
              id="dodgers-popup-video"

              src="https://www.youtube.com/embed/${encodeURIComponent(
                videoId
              )}?rel=0"

              title="${escapeHTML(
                recap.title
              )}"

              allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share
              "

              allowfullscreen
            ></iframe>

          `;

        } else {

          videoWrapper.innerHTML = `

            <div
              id="dodgers-video-loading"
            >
              Unable to embed this video.
            </div>

          `;

        }


        recapContent.innerHTML = `

          <a
            href="${escapeHTML(
              recap.url
            )}"

            target="_blank"

            rel="noopener noreferrer"

            id="dodgers-recap-link"
          >

            <span>
              ${escapeHTML(
                recap.title
              )}
            </span>


            <span>
              ↗
            </span>

          </a>

        `;

      } else {

        videoWrapper.innerHTML = `

          <div
            id="dodgers-video-loading"
          >
            Unable to load the latest recap.
          </div>

        `;


        recapContent.textContent =
          "Unable to load the latest recap.";
      }


      /*
       * Close button.
       */

      document
        .getElementById(
          "dodgers-popup-close"
        )
        .addEventListener(
          "click",
          event => {

            event.stopPropagation();

            backdrop.remove();

          }
        );


      /*
       * Clicking outside popup closes it.
       */

      backdrop.addEventListener(
        "click",
        event => {

          if (
            event.target ===
            backdrop
          ) {

            backdrop.remove();

          }

        }
      );

    }


    /* ============================================================
       PROJECT EDITOR
       ============================================================ */

    function openProjectEditor() {

      const projects =
        getProjects().map(
          project => ({
            ...project
          })
        );


      const backdrop =
        document.createElement(
          "div"
        );


      backdrop.id =
        "editor-backdrop";


      backdrop.innerHTML = `

        <div id="editor">

          <h2>
            Edit Projects
          </h2>


          <p id="editor-subtitle">
            Add projects you're actively working on.
          </p>


          <div
            id="editor-items"
          ></div>


          <button
            id="add-item"
          >
            + Add project
          </button>


          <div
            class="editor-actions"
          >

            <button
              class="small-button"
              id="cancel-editor"
            >
              Cancel
            </button>


            <button
              class="small-button"
              id="save-editor"
            >
              Save
            </button>

          </div>

        </div>

      `;


      document.body.appendChild(
        backdrop
      );


      const itemContainer =
        document.getElementById(
          "editor-items"
        );


      function renderEditorItems() {

        itemContainer.innerHTML =
          "";


        projects.forEach(
          (project, index) => {

            const row =
              document.createElement(
                "div"
              );


            row.className =
              "edit-item";


            row.innerHTML = `

              <input
                class="edit-input"

                data-field="title"

                data-index="${index}"

                placeholder="Project name"

                value="${escapeHTML(
                  project.title || ""
                )}"
              >


              <input
                class="edit-input"

                data-field="url"

                data-index="${index}"

                placeholder="https://..."

                value="${escapeHTML(
                  project.url || ""
                )}"
              >


              <button
                class="delete-item"

                data-index="${index}"

                title="Delete"
              >
                ×
              </button>

            `;


            itemContainer.appendChild(
              row
            );

          }
        );


        itemContainer
          .querySelectorAll(
            ".delete-item"
          )
          .forEach(
            button => {

              button.addEventListener(
                "click",
                () => {

                  projects.splice(
                    Number(
                      button.dataset.index
                    ),
                    1
                  );


                  renderEditorItems();

                }
              );

            }
          );

      }


      renderEditorItems();


      /*
       * Add project.
       */

      document
        .getElementById(
          "add-item"
        )
        .addEventListener(
          "click",
          () => {

            projects.push({
              title: "",
              url: ""
            });


            renderEditorItems();


            const inputs =
              itemContainer
                .querySelectorAll(
                  '[data-field="title"]'
                );


            inputs[
              inputs.length - 1
            ]?.focus();

          }
        );


      /*
       * Cancel.
       */

      document
        .getElementById(
          "cancel-editor"
        )
        .addEventListener(
          "click",
          () => {

            backdrop.remove();

          }
        );


      /*
       * Save.
       */

      document
        .getElementById(
          "save-editor"
        )
        .addEventListener(
          "click",
          () => {

            const updatedProjects =
              [];


            itemContainer
              .querySelectorAll(
                ".edit-item"
              )
              .forEach(
                row => {

                  const title =
                    row
                      .querySelector(
                        '[data-field="title"]'
                      )
                      .value
                      .trim();


                  const url =
                    row
                      .querySelector(
                        '[data-field="url"]'
                      )
                      .value
                      .trim();


                  if (title) {

                    updatedProjects.push({

                      title,

                      url:
                        url || "#"

                    });

                  }

                }
              );


            saveProjects(
              updatedProjects
            );


            backdrop.remove();


            refreshDashboard();

          }
        );

    }


    /* ============================================================
       REFRESH
       ============================================================ */

    function refreshDashboard() {

      const goal =
        getTodayGoal();


      if (goal) {

        showMainScreen(
          goal
        );

      }

    }


    /* ============================================================
       RESTART
       ============================================================ */

    function restartRoutine() {

      const goals =
        getDailyGoals();


      const today =
        getToday();


      delete goals[today];


      if (
        Object.keys(
          goals
        ).length
      ) {

        setCookie(
          "dailyGoals",
          JSON.stringify(
            goals
          )
        );

      } else {

        deleteCookie(
          "dailyGoals"
        );

      }


      deleteCookie(
        "goalCreated"
      );


      showGreeting();

    }


    /* ============================================================
       GREETING CLICK
       ============================================================ */

    document.addEventListener(
      "click",
      () => {

        if (
          currentScene === 0
        ) {

          showSleepRating();

        }

      }
    );


    /* ============================================================
       STARTUP
       ============================================================ */

    function initialize() {

      if (
        hasCreatedGoalToday()
      ) {

        const goal =
          getTodayGoal();


        if (goal) {

          showMainScreen(
            goal
          );

          return;

        }


        deleteCookie(
          "goalCreated"
        );

      }


      showGreeting();

    }


    initialize();

  </script>
